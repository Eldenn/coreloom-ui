# Tests every push and pull request, then publishes to GitHub Pages from main:
#   https://eldenn.github.io/coreloom-ui/        the latest release: Storybook, the registry (r/),
#                                                the design tokens (tokens/), llms.txt, the starter demo
#   https://eldenn.github.io/coreloom-ui/next/   the same, built from main (what the next release holds)
# build/build-site.sh builds one copy. The root only changes when a release changes package.json's version.
# Consumers: pnpm dlx shadcn@latest registry add @coreloom=https://eldenn.github.io/coreloom-ui/r/{name}.json
name: Registry & Storybook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint, typecheck, unit tests, registry and starter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The linter type-checks the starter too, so its dependencies come first.
      - run: pnpm --dir starter install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm registry:build
      # What each item costs an app (gzip): fails when one outgrows build/registry-sizes.json.
      - run: pnpm registry:size --check
      # Every prop a guide names exists, and every prop a component declares is in its guide.
      - run: pnpm docs:check
      # The starter carries copies of the registry items: fail if they drifted, then build it.
      - run: node build/sync-starter.mjs --check
      - run: pnpm --dir starter build

  # The Playwright suite (a11y, visual, interactions, docs, starter) split in four: each shard
  # builds Storybook and the starter (under 20 s) and runs a quarter of the tests.
  test:
    name: Playwright ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    # Same image as the "Visual baselines" workflow, so screenshots render identically.
    # Keep the tag in step with @playwright/test in package.json.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir starter install --frozen-lockfile
      - run: pnpm storybook:build
      - run: pnpm --dir starter build
      - run: pnpm test --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  build:
    needs: [checks, test]
    # Pages only accepts main: a run started on another branch (the visual baselines workflow
    # starts one on its branch) tests, but doesn't build or deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the history, to find the commit that set the released version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # The site's root serves the latest release, so the @coreloom namespace, Storybook and the
      # guides never change without a release; main is served under /next/ to try what's coming.
      # The release is the last commit that changed package.json's version (the Version Packages
      # commit, as in release.yml): it is right even while the release workflow is still tagging it.
      - name: Find the released commit
        id: release
        run: |
          ref="$(git log -1 --format=%H -G'"version":' -- package.json)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Root: v$(node -p "require('./package.json').version") at $ref; /next/: $GITHUB_SHA"
      - name: Build main under /next/
        run: build/build-site.sh . site/next /coreloom-ui/next/
      - name: Build the release at the root
        run: |
          git worktree add ../release "${{ steps.release.outputs.ref }}"
          build/build-site.sh ../release site /coreloom-ui/
      # GitHub Pages serves 404.html for any unknown path, so deep links into the starter demo
      # (/coreloom-ui/starter/projects) still boot the app.
      - run: cp site/starter/index.html site/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}r/registry.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
