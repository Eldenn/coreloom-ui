# Tests every push and pull request, then builds the shadcn registry (public/r/*.json), Storybook
# (public/storybook), the DTCG tokens (public/tokens) and the starter demo (public/starter) and publishes
# them to GitHub Pages from main: https://eldenn.github.io/coreloom-ui/ (Storybook), …/r/ (registry),
# …/tokens/ (design tokens), …/starter/ (demo app).
# Consumers: pnpm dlx shadcn@latest registry add @coreloom=https://eldenn.github.io/coreloom-ui/r/{name}.json
name: Registry & Storybook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint, typecheck, unit tests, registry and starter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The linter type-checks the starter too, so its dependencies come first.
      - run: pnpm --dir starter install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm registry:build
      # The starter carries copies of the registry items: fail if they drifted, then build it.
      - run: node build/sync-starter.mjs --check
      - run: pnpm --dir starter build

  # The Playwright suite (a11y, visual, interactions, docs, starter) split in four: each shard
  # builds Storybook and the starter (under 20 s) and runs a quarter of the tests.
  test:
    name: Playwright ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    # Same image as the "Visual baselines" workflow, so screenshots render identically.
    # Keep the tag in step with @playwright/test in package.json.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir starter install --frozen-lockfile
      - run: pnpm storybook:build
      - run: pnpm --dir starter build
      - run: pnpm test --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  build:
    needs: [checks, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build
      - run: pnpm storybook:build
      # The tokens in the DTCG format, at /coreloom-ui/tokens/ (Figma, Style Dictionary, native apps).
      - run: pnpm tokens:dtcg
      # What AI assistants read (https://llmstxt.org): /coreloom-ui/llms.txt, llms-full.txt, guides/.
      - run: pnpm llms
      # The starter as a live demo at /coreloom-ui/starter/. GitHub Pages serves 404.html for any
      # unknown path, so deep links (/coreloom-ui/starter/projects) still boot the app.
      - run: pnpm --dir starter install --frozen-lockfile
      - run: pnpm --dir starter exec vite build --base /coreloom-ui/starter/ --outDir ../public/starter --emptyOutDir
      - run: cp public/starter/index.html public/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}r/registry.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
