# Regenerates the visual-test screenshots (tests/__screenshots__) in CI's Playwright container and
# commits them to the branch it runs on. Run it from the Actions tab ("Run workflow", pick the
# branch) once to create the baselines, then after every intended visual change; review the PNGs
# in the commit before merging. A push made by a workflow doesn't start other workflows, so it then
# starts "Registry & Storybook" on the same branch itself: on main, that tests and deploys Pages.
name: Visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm storybook:build
      - run: rm -rf tests/__screenshots__ && pnpm test:update
      - name: Commit the screenshots
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Update visual baselines"
            # Someone may have pushed while the screenshots were taken (they take minutes): put
            # this commit on top. It only touches tests/__screenshots__, so it can't conflict
            # with code; if the code changed what renders, run the workflow again.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
      - name: Test and deploy with the new screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/registry.yml/dispatches`
            fetch(url, {
              method: "POST",
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json" },
              body: JSON.stringify({ ref: process.env.GITHUB_REF_NAME }),
            }).then(async (r) => { if (!r.ok) { console.error(r.status, await r.text()); process.exit(1) } console.log("Started Registry & Storybook on", process.env.GITHUB_REF_NAME) })
          '
