# Publishes a GitHub release when a version tag is pushed:
#   1. bump "version" in package.json, add the release to CHANGELOG.md, commit, push main
#   2. git tag v0.6.0 && git push origin v0.6.0
# The release gets the CHANGELOG section as notes and the built registry (public/r/*.json)
# as assets, so projects can pin it:
#   "@coreloom": "https://github.com/Eldenn/coreloom-ui/releases/download/v0.6.0/{name}.json"
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json and the CHANGELOG
        run: node build/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
      - run: pnpm registry:build
      - run: pnpm tokens:dtcg
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" public/r/*.json public/tokens/*.json --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
