<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.ColorPicker || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { ColorPicker, Field, FieldLabel } = UI;
      function Demo() {
        const [c, setC] = React.useState('#14b8a6');
        return h(Field, { style: { maxWidth: 280 } }, h(FieldLabel, { htmlFor: 'color' }, 'Label color'), h(ColorPicker, { id: 'color', value: c, onValueChange: setC }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
