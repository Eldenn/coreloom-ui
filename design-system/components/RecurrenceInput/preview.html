<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.RecurrenceInput || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { RecurrenceInput } = UI;
      function Demo() {
        const [v, setV] = React.useState({ frequency: 'week', interval: 2, weekdays: [1, 3], end: { type: 'after', count: 10 } });
        return h('div', { style: { maxWidth: 460 } }, h(RecurrenceInput, { value: v, onValueChange: setV }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
