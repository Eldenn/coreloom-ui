<!-- @dsCard group="Brand" height=420 page subtitle="The ginger cat · lockups · tile · small-size cut · dark and light" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);font-family:var(--font-sans);color:var(--fg-1);padding:28px 32px;}
  .row{display:flex;align-items:center;gap:36px;flex-wrap:wrap}
  .panel{border-radius:14px;padding:22px 26px;display:flex;align-items:center;gap:14px}
  .dark{background:#15171C;border:1px solid var(--border)}
  .light{background:#F4F5F7}
  .ui{font-family:var(--font-mono);font-weight:600;font-size:13px;letter-spacing:0.06em;color:#1CE0D3;
      background:rgba(28,224,211,0.10);border:1px solid rgba(28,224,211,0.30);border-radius:7px;padding:4px 8px;line-height:1}
  .light .ui{color:#0F8F8C;background:rgba(15,143,140,0.10);border-color:rgba(15,143,140,0.30)}
  .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-muted);margin:22px 0 10px}
  .sizes{display:flex;align-items:flex-end;gap:18px}
  .sizes figure{margin:0;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)}
  .sizes img{display:block;margin:0 auto 6px}
</style>
</head>
<body>
  <div class="row">
    <div class="panel dark"><img src="../../assets/Logos/coreloom-horizontal-dark.svg" alt="Coreloom" style="height:48px;width:auto;display:block"><span class="ui">UI</span></div>
    <div class="panel light"><img src="../../assets/Logos/coreloom-horizontal-light.svg" alt="Coreloom" style="height:48px;width:auto;display:block"><span class="ui">UI</span></div>
    <div class="panel dark"><img src="../../assets/Logos/coreloom-stacked-dark.svg" alt="Coreloom" style="height:96px;width:auto;display:block"></div>
  </div>
  <div class="tag">Tile and the small-size cut · actual pixels</div>
  <div class="sizes">
    <figure><img src="../../assets/Logos/coreloom-logomark.svg" alt="" width="96" height="96">96</figure>
    <figure><img src="../../assets/Logos/coreloom-logomark.svg" alt="" width="64" height="64">64</figure>
    <figure><img src="../../assets/Logos/coreloom-tile-small.svg" alt="" width="32" height="32">32</figure>
    <figure><img src="../../assets/Logos/coreloom-tile-small.svg" alt="" width="16" height="16">16</figure>
    <figure style="background:#fff;border-radius:8px;padding:6px 6px 0"><img src="../../assets/Logos/coreloom-symbol-black.svg" alt="" width="52" height="52">one colour</figure>
    <figure style="background:#000;border-radius:8px;padding:6px 6px 0;color:#9ca3b1"><img src="../../assets/Logos/coreloom-symbol-white.svg" alt="" width="52" height="52">reversed</figure>
  </div>
</body>
</html>
