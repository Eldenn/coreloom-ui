<!-- @dsCard group="Data display" height=320 subtitle="Load more · infinite scroll · try again · end" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.LoadMore || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { LoadMore, TooltipProvider } = UI;
      function Demo() {
        const [count, setCount] = React.useState(4);
        const [status, setStatus] = React.useState('idle');
        const more = () => { setStatus('loading'); setTimeout(() => { const n = Math.min(12, count + 4); setCount(n); setStatus(n >= 12 ? 'done' : 'idle'); }, 600); };
        return h('div', { style: { maxWidth: 420 } },
          h('ul', { className: 'm-0 list-none divide-y divide-border-subtle rounded-lg border border-border bg-card p-0' },
            Array.from({ length: count }, (_, i) => h('li', { key: i, className: 'px-4 py-2.5 text-[13px]' }, 'Project ' + (i + 1)))),
          h(LoadMore, { status, onLoadMore: more, loaded: count, total: 12 }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(TooltipProvider, null, h(Demo)));
    }
    render();
  </script>
</body>
</html>
