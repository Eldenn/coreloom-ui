        { id: 'v1', createdAt: at(10, 9), author: 'Alan Turing', name: 'First draft', content: '# Pricing\n\n- Free' }];
      function Demo() {
        return h(VersionHistory, { versions, onRestore: () => undefined, onRename: () => undefined });

      ReactDOM.createRoot(document.getElementById('root')).render(h(TooltipProvider, null, h(Demo)));
