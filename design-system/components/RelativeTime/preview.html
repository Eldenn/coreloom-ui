<!-- @dsCard group="Data display" height=120 subtitle="“5 minutes ago” · live · full date on hover" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.RelativeTime || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { RelativeTime } = UI;
      function Demo() {
        const now = Date.now();
        return h('div', { style: { display: 'grid', gap: 8, fontSize: 14 } },
          h(RelativeTime, { date: now - 5 * 60000 }),
          h(RelativeTime, { date: now - 26 * 3600000 }),
          h(RelativeTime, { date: now + 3 * 86400000 }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
