<!-- @dsCard group="Motion" height=220 subtitle="Scroll reveal · effects · stagger" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Stagger || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Reveal, Stagger, Button } = UI;
      function Demo() {
        const [run, setRun] = React.useState(0);
        return h('div', { style: { display: 'grid', gap: 12 } },
          h(Stagger, { key: run, className: 'grid grid-cols-3 gap-3', step: 90 },
            ['Previews', 'Rollbacks', 'Logs', 'Alerts', 'Teams', 'Audit'].map((t) =>
              h('div', { key: t, className: 'rounded-xl border border-border bg-card p-4 text-[14px]' }, t))),
          h(Reveal, { key: 'r' + run, effect: 'blur', delay: 500, className: 'text-[13px] text-muted-foreground' }, 'Six features, one after the other.'),
          h('div', null, h(Button, { size: 'sm', variant: 'outline', onClick: () => setRun(run + 1) }, 'Replay')));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
