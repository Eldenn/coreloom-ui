<!-- @dsCard group="Data display" height=360 subtitle="Replies · reactions · mentions" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.CommentThread || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { CommentThread } = UI;
      function Demo() {
        const [comments, setComments] = React.useState([
          { id: 'a', author: { name: 'Léa Martin' }, body: 'Can we ship this to 10% first?', createdAt: Date.now() - 3600000, reactions: [{ emoji: '👍', count: 2, reacted: true }],
            replies: [{ id: 'b', author: { name: 'Tom Bernard' }, body: 'Yes, after the 2 pm deploy.', createdAt: Date.now() - 1800000 }] }]);
        const me = { name: 'Inès Morel' };
        return h('div', { style: { maxWidth: 520 } }, h(CommentThread, { comments, currentUser: me,
          onSubmit: (text, parentId) => setComments((list) => { const c = { id: String(Math.random()), author: me, body: text, createdAt: Date.now() };
            return parentId ? list.map((x) => x.id === parentId ? Object.assign({}, x, { replies: (x.replies || []).concat(c) }) : x) : list.concat(c); }) }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
