<!-- @dsCard group="Motion" height=220 subtitle="Fade · slide · scale between views" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.useViewTransition || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { useViewTransition, Button } = UI;
      const steps = [['Create a project', 'Name it and pick a region.'], ['Connect a repository', 'Every push to main deploys.'], ['Invite the team', 'Add people by email.']];
      function Demo() {
        const transition = useViewTransition();
        const [step, setStep] = React.useState(0);
        const go = (next) => transition(() => setStep(next), { effect: next > step ? 'slide' : 'slide-back' });
        return h('div', { className: 'flex max-w-md flex-col gap-4 rounded-xl border border-border bg-card p-5' },
          h('div', { style: { minHeight: 56 } },
            h('p', { className: 'm-0 text-[17px] font-medium' }, steps[step][0]),
            h('p', { className: 'm-0 mt-1 text-[14px] text-muted-foreground' }, steps[step][1])),
          h('div', { className: 'flex justify-between' },
            h(Button, { variant: 'outline', disabled: step === 0, onClick: () => go(step - 1) }, 'Back'),
            h(Button, { disabled: step === 2, onClick: () => go(step + 1) }, 'Next')));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
