<!-- @dsCard group="Data display" height=120 subtitle="Dot + word · pill · pulse" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.StatusIndicator || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { StatusIndicator } = UI;
      function Demo() {
        return h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 16 } },
          h(StatusIndicator, { tone: 'success' }, 'Operational'),
          h(StatusIndicator, { tone: 'info', pulse: true }, 'Deploying'),
          h(StatusIndicator, { tone: 'warning', variant: 'pill' }, 'Degraded'),
          h(StatusIndicator, { tone: 'danger', variant: 'pill' }, 'Outage'));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
