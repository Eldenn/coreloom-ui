<!-- @dsCard group="Data display" height=230 subtitle="Thumbnails · full-screen viewer" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.ImageGallery || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { ImageGallery } = UI;
      function Demo() {
        const pic = (c) => 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 3"><rect width="4" height="3" fill="' + c + '"/></svg>');
        const images = ['#0fa89f', '#9085e9', '#d95926', '#3987e5', '#d55181', '#3dd68c'].map((c, i) => ({ src: pic(c), alt: 'Sample ' + (i + 1) }));
        return h('div', { style: { maxWidth: 420 } }, h(ImageGallery, { images }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
