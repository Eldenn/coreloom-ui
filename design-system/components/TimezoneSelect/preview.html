<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.TimezoneSelect || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { TimezoneSelect } = UI;
      function Demo() {
        const [v, setV] = React.useState('Europe/Paris');
        return h('div', { style: { maxWidth: 320 } }, h(TimezoneSelect, { 'aria-label': 'Time zone', value: v, onValueChange: setV }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
