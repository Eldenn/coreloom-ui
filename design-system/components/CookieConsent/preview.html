<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 32px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.CookieConsent || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { CookieConsent } = UI;
      function Demo() {
        const [value, setValue] = React.useState(null);
        return h('div', { style: { maxWidth: 1100, margin: '0 auto' } }, value
          ? h('p', null, 'Saved: ' + JSON.stringify(value))
          : h(CookieConsent, { value, onValueChange: setValue, position: 'inline', policyHref: '#' }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(UI.TooltipProvider, null, h(Demo)));
    }
    render();
  </script>
</body>
</html>
