<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.CodeEditor || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { CodeEditor } = UI;
      function Demo() {
        const [value, setValue] = React.useState("export function total(items) {\n  let sum = 0\n  for (const item of items) {\n    sum += item.price * item.qty\n  }\n  console.log('total', sum)\n  return sum\n}\n");
        const diagnostics = [{ line: 6, column: 3, endColumn: 14, severity: 'warning', message: 'Unexpected console statement.', source: 'no-console' }];
        return h('div', { style: { maxWidth: 560 } }, h(CodeEditor, { value, onChange: setValue, path: 'total.js', diagnostics, 'aria-label': 'total.js' }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
