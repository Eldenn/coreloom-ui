<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.ImageInput || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { ImageInput } = UI;
      function Demo() {
        return h(ImageInput, { 'aria-label': 'Profile photo', maxSize: 2097152, fallback: h('span', { style: { fontSize: 20, fontWeight: 500 } }, 'AL') });
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
