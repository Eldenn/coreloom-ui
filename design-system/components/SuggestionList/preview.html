<!-- @dsCard group="Actions" height=320 subtitle="Accept · edit then accept · ignore, one suggestion at a time" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.SuggestionList || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { SuggestionList } = UI;
      const initial = [
        { id: 'a', label: 'Testing', text: 'Write a Playwright spec for every new page.', detail: 'From your notes on testing' },
        { id: 'b', label: 'Git', text: 'Write commit messages in English.' },
      ];
      function Demo() {
        const [items, setItems] = React.useState(initial);
        const drop = (s) => setItems((list) => list.filter((x) => x.id !== s.id));
        return h('div', { style: { maxWidth: 520 } },
          h(SuggestionList, { suggestions: items, onAccept: drop, onDismiss: drop }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
