<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.FormRenderer || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const spec = {
        version: 1,
        title: 'Contact us',
        sections: [{ id: 'main', columns: 2, fields: [
          { name: 'email', type: 'email', label: 'Email', required: true },
          { name: 'topic', type: 'select', label: 'Topic', required: true, defaultValue: 'sales', options: [{ value: 'sales', label: 'Sales' }, { value: 'support', label: 'Support' }] },
          { name: 'company', type: 'text', label: 'Company', visibleWhen: { field: 'topic', op: 'equals', value: 'sales' } },
          { name: 'seats', type: 'number', label: 'Seats', min: 1, visibleWhen: { field: 'topic', op: 'equals', value: 'sales' } },
        ] }],
      };
      ReactDOM.createRoot(document.getElementById('root')).render(h(UI.FormRenderer, { spec, onSubmit: () => {} }));
    }
    render();
  </script>
</body>
</html>
