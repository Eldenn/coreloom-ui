<!-- @dsCard group="Data display" height=420 subtitle="MediaPlayer · controls, chapters, transcript" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px;max-width:640px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // A 20-second tone made here, so the card needs no media file.
    function tone() {
      const rate = 8000, seconds = 20, count = rate * seconds;
      const data = new DataView(new ArrayBuffer(44 + count * 2));
      const text = (o, s) => [...s].forEach((c, i) => data.setUint8(o + i, c.charCodeAt(0)));
      text(0, 'RIFF'); data.setUint32(4, 36 + count * 2, true); text(8, 'WAVE'); text(12, 'fmt ');
      data.setUint32(16, 16, true); data.setUint16(20, 1, true); data.setUint16(22, 1, true);
      data.setUint32(24, rate, true); data.setUint32(28, rate * 2, true); data.setUint16(32, 2, true);
      data.setUint16(34, 16, true); text(36, 'data'); data.setUint32(40, count * 2, true);
      for (let i = 0; i < count; i++) {
        const t = i / rate;
        data.setInt16(44 + i * 2, Math.round(6000 * (0.5 + 0.5 * Math.sin(2 * Math.PI * 2 * t)) * Math.sin(2 * Math.PI * 196 * t)), true);
      }
      return URL.createObjectURL(new Blob([data.buffer], { type: 'audio/wav' }));
    }
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.MediaPlayer || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(UI.MediaPlayer, {
          kind: 'audio',
          title: 'Coreloom Weekly · Episode 12',
          src: tone(),
          chapters: [{ start: 0, title: 'News of the week' }, { start: 10, title: 'Listener questions' }],
          transcript: [
            { start: 0, end: 5, speaker: 'Sam', text: 'Hello and welcome to episode twelve.' },
            { start: 5, end: 10, speaker: 'Ana', text: 'This week: three releases and one guest.' },
            { start: 10, end: 20, speaker: 'Ana', text: 'Your questions now, starting with live regions.' },
          ],
        }));
    }
    render();
  </script>
</body>
</html>
