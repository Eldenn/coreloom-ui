<!-- @dsCard group="Blocks" width=1280 height=520 subtitle="flags per environment · rollout · targeting rules" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.FeatureFlags || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { FeatureFlags, TooltipProvider } = UI;
      const environments = [{ id: 'production', name: 'Production' }, { id: 'staging', name: 'Staging' }];
      const attributes = [{ value: 'plan', label: 'Plan' }, { value: 'country', label: 'Country' }];
      function Demo() {
        const [flags, setFlags] = React.useState([
          { key: 'new-checkout', name: 'New checkout', tags: ['billing'], environments: { production: { enabled: true, rollout: 25, rules: [{ id: 'r1', attribute: 'plan', operator: 'in', values: ['pro'], serve: true }] } } },
          { key: 'ai-summaries', name: 'AI summaries', description: 'Summaries of long threads.', environments: { production: { enabled: false, rollout: 0, rules: [] } } }]);
        return h('div', { style: { maxWidth: 860, margin: '0 auto' } }, h(FeatureFlags, { flags, environments, attributes,
          onChange: (key, env, state) => setFlags((l) => l.map((f) => f.key === key ? Object.assign({}, f, { environments: Object.assign({}, f.environments, { [env]: state }) }) : f)) }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(TooltipProvider, null, h(Demo)));
    }
    render();
  </script>
</body>
</html>
