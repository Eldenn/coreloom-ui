<!-- @dsCard group="Blocks" height=620 subtitle="Booking · service, calendar, times, recap, confirmation" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px;max-width:820px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Booking || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const pad = (n) => String(n).padStart(2, '0');
      // Free times every 45 minutes, 9:00 to 12:00 and 14:00 to 18:00, one in three taken.
      async function onLoadSlots({ date }) {
        await wait(400);
        const slots = [];
        for (const [from, to] of [[540, 720], [840, 1080]])
          for (let t = from; t + 45 <= to; t += 45)
            slots.push({ start: new Date(`${date}T${pad(Math.floor(t / 60))}:${pad(t % 60)}:00`).toISOString(), available: t % 3 !== 0 });
        return slots;
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(UI.Booking, {
          services: [
            { id: 'first', name: 'First consultation', duration: 60, price: '€70', description: 'History, assessment and a first treatment.' },
            { id: 'follow-up', name: 'Follow-up', duration: 45, price: '€60' },
          ],
          onLoadSlots,
          onBook: async () => { await wait(600); return { reference: 'RDV-4821' }; },
          isDateUnavailable: (d) => d.getDay() === 0,
        }));
    }
    render();
  </script>
</body>
</html>
