<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.DurationInput || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { DurationInput } = UI;
      function Demo() {
        const [m, setM] = React.useState(90);
        return h('div', { className: 'flex flex-col gap-2' }, h(DurationInput, { 'aria-label': 'Duration', value: m, onValueChange: setM }), h('span', { className: 'text-[12px] text-muted-foreground' }, String(m) + ' minutes'));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
