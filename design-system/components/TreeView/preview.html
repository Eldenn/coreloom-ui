<!-- @dsCard group="Data display" height=240 subtitle="APG tree · icons · meta · selection" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.TreeView || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { TreeView } = UI;
      function Demo() {
        const [sel, setSel] = React.useState('button');
        const nodes = [
          { id: 'src', label: 'src', children: [
            { id: 'components', label: 'components', children: [
              { id: 'button', label: 'button.tsx', meta: '4 KB' }, { id: 'card', label: 'card.tsx', meta: '2 KB' }] },
            { id: 'index', label: 'index.ts', meta: '1 KB' }] },
          { id: 'readme', label: 'README.md', meta: '3 KB' }];
        return h('div', { style: { maxWidth: 320 } }, h(TreeView, { 'aria-label': 'Files', nodes, selectionMode: 'single', selected: sel, onSelectedChange: setSel, defaultExpanded: ['src', 'components'] }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
