<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.DiagramCard || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { DiagramCard, parseMermaid } = UI;
      const diagram = parseMermaid("classDiagram\n  class Order\n  class LineItem\n  class Payment\n  Order *-- LineItem\n  Order o-- Payment").diagram;
      const now = Date.now();
      const actions = [
        { label: 'Open', onSelect: () => {} },
        { label: 'Duplicate', onSelect: () => {} },
        { label: 'Share', onSelect: () => {} },
        { label: 'Delete', destructive: true, onSelect: () => {} },
      ];
      function Demo() {
        return h('div', { style: { display: 'grid', gap: 16, gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))' } },
          h(DiagramCard, { title: 'Checkout', href: '#checkout', diagram, visibility: 'public', updatedAt: new Date(now - 5 * 60000), diagramCount: 4, actions }),
          h(DiagramCard, { title: 'Billing', href: '#billing', visibility: 'protected', updatedAt: new Date(now - 26 * 3600000), diagramCount: 2, actions }),
          h(DiagramCard, { title: 'New architecture', href: '#new', visibility: 'private', updatedAt: new Date(now - 60000), diagramCount: 1, actions }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
