<!-- @dsCard group="Forms" height=200 subtitle="Single (view switch) · multiple · outline" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.ToggleGroup || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { ToggleGroup, ToggleGroupItem, Icon } = UI;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, alignItems: 'flex-start' } },
          h(ToggleGroup, { type: 'single', variant: 'outline', defaultValue: 'grid', 'aria-label': 'View' },
            h(ToggleGroupItem, { value: 'list', 'aria-label': 'List' }, h(Icon, { name: 'menu' }), 'List'),
            h(ToggleGroupItem, { value: 'grid', 'aria-label': 'Grid' }, h(Icon, { name: 'layoutGrid' }), 'Grid'),
            h(ToggleGroupItem, { value: 'code', 'aria-label': 'Code' }, h(Icon, { name: 'terminal' }), 'Code')),
          h(ToggleGroup, { type: 'multiple', defaultValue: ['ready', 'building'], spacing: 1, 'aria-label': 'Status filter' },
            h(ToggleGroupItem, { value: 'ready' }, 'Ready'),
            h(ToggleGroupItem, { value: 'building' }, 'Building'),
            h(ToggleGroupItem, { value: 'failed' }, 'Failed'),
            h(ToggleGroupItem, { value: 'queued' }, 'Queued')))
      );
    }
    render();
  </script>
</body>
</html>
