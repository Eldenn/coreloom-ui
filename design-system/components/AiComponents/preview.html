<!-- @dsCard group="AI" height=920 subtitle="PromptInput · Markdown · Reasoning · ToolCall" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-muted);margin:0 0 10px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.PromptInput || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;

      const md = '## Rolling back\n\nRoll back when **production is down** and a fix will take longer than a few minutes.\n\n| Step | Owner |\n|---|---|\n| Decide | On-call |\n| Roll back | On-call |\n\n```bash\ncoreloom rollback coreloom-api --to dpl_5t3q\n```\n\n- [x] Status page updated\n- [ ] Postmortem scheduled';
      function App() {
        const [status, setStatus] = React.useState('ready');
        const [rb, setRb] = React.useState({ type: 'tool-rollback', toolCallId: '3', state: 'approval-requested', input: { deployment: 'dpl_5t3q' }, approval: { id: 'a1' } });
        return h('div', { className: 'grid gap-6', style: { gridTemplateColumns: '1fr 1fr' } },
          h('div', { className: 'flex flex-col gap-4' },
            h('p', { className: 'cap' }, 'ToolCall · Reasoning'),
            h(UI.Reasoning, { text: 'Checked the logs: a type error in settings.tsx.', duration: 6 }),
            h(UI.ToolCall, { part: { type: 'tool-searchDocs', toolCallId: '1', state: 'input-available', input: { query: 'rollback' } }, label: 'Search the docs' }),
            h(UI.ToolCall, { part: { type: 'tool-searchDeployments', toolCallId: '2', state: 'output-available', input: { project: 'coreloom-api' }, output: { id: 'dpl_8f2k', status: 'failed' } } }),
            h(UI.ToolCall, { part: rb, label: 'Roll back production', onApprovalResponse: ({ approved }) => setRb((p) => approved ? { ...p, state: 'output-available', output: { status: 'rolled back' } } : { ...p, state: 'output-denied' }) }),
            h(UI.ToolCall, { part: { type: 'dynamic-tool', toolName: 'sendEmail', toolCallId: '4', state: 'output-error', input: { to: 'ops@acme.dev' }, errorText: 'SMTP timeout after 10 s.' } }),
            h('p', { className: 'cap', style: { marginTop: 12 } }, 'PromptInput'),
            h(UI.PromptInput, { status, allowAttachments: true, onStop: () => setStatus('ready'), onSubmit: () => setStatus('streaming'), toolbar: h(UI.Badge, { variant: 'secondary' }, 'Claude Sonnet') })),
          h('div', null, h('p', { className: 'cap' }, 'Markdown'), h(UI.Markdown, null, md)));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(UI.TooltipProvider, null, h(App)));
    }
    render();
  </script>
</body>
</html>
