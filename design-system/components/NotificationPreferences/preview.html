<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.NotificationPreferences || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { NotificationPreferences, TooltipProvider } = UI;
      const channels = [{ id: 'email', label: 'E-mail' }, { id: 'push', label: 'Push' }, { id: 'app', label: 'In-app' }];
      const events = [
        { id: 'mention', group: 'Activity', label: 'Mentions', description: 'Someone @mentions you.' },
        { id: 'reply', group: 'Activity', label: 'Replies to your comments' },
        { id: 'deploy', group: 'Projects', label: 'Failed deployments', unavailable: ['app'] },
        { id: 'login', group: 'Security', label: 'New sign-in', required: ['email'] }];
      function Demo() {
        return h('div', { style: { maxWidth: 760, margin: '0 auto' } },
          h(NotificationPreferences, { events, channels, defaultValue: { mention: ['email', 'push', 'app'], reply: ['app'], deploy: ['email'] } }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(TooltipProvider, null, h(Demo)));
    }
    render();
  </script>
</body>
</html>
