<!-- @dsCard group="Data display" height=260 subtitle="Trigger · open content · chevron state" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);font-family:var(--font-mono);font-size:13px;color:var(--fg-2);background:var(--surface-1)}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Collapsible || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Collapsible, CollapsibleTrigger, CollapsibleContent, Button, Icon } = UI;
      function Demo() {
        const [open, setOpen] = React.useState(true);
        return h(Collapsible, { open, onOpenChange: setOpen, style: { maxWidth: 420, display: 'flex', flexDirection: 'column', gap: 8 } },
          h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between' } },
            h('span', { style: { fontSize: 14, fontWeight: 600 } }, 'Environment variables'),
            h(CollapsibleTrigger, { asChild: true }, h(Button, { variant: 'ghost', size: 'icon-sm', 'aria-label': 'Toggle variables' }, h(Icon, { name: 'chevronDown', style: { transform: open ? 'rotate(180deg)' : 'none', transition: 'transform 180ms' } })))),
          h('div', { className: 'row' }, 'DATABASE_URL', h('span', null, '••••••••')),
          h(CollapsibleContent, { style: { display: 'flex', flexDirection: 'column', gap: 8 } },
            h('div', { className: 'row' }, 'REDIS_URL', h('span', null, '••••••••')),
            h('div', { className: 'row' }, 'SENTRY_DSN', h('span', null, '••••••••'))));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
