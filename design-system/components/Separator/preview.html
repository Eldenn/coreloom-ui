<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);padding:24px 28px;font-family:var(--font-sans);}
  .meta{display:flex;gap:12px;align-items:center;height:18px;font-family:var(--font-mono);font-size:12px;color:var(--fg-muted);margin-top:14px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Separator || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Separator } = UI;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h('div', null,
          h('div', { style: { fontSize: 14, color: 'var(--fg-2)', marginBottom: 14 } }, 'Coreloom UI — the component package of the Coreloom monorepo.'),
          h(Separator),
          h('div', { className: 'meta' }, 'v2.4.0', h(Separator, { orientation: 'vertical' }), 'MIT', h(Separator, { orientation: 'vertical' }), '19 components'),
        )
      );
    }
    render();
  </script>
</body>
</html>
