<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.FileCard || !UI.FileCardList || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { FileCard, FileCardList } = UI;
      function Demo() {
        const noop = () => {};
        return h(FileCardList, { style: { maxWidth: 448 } },
          h(FileCard, { name: 'Q3 report — board version final.pdf', size: 482113, href: '#', onRemove: noop }),
          h(FileCard, { name: 'customers-2026.csv', size: 92400, progress: 64, onRemove: noop }),
          h(FileCard, { name: 'brand assets.zip', size: 248000000, error: 'Too large: 100 MB at most.', onRetry: noop, onRemove: noop }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
