<!DOCTYPE html>
<html lang="en">
<head>

<style>

<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.KanbanBoard || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const I = UI.icons;

      const { KanbanBoard, TooltipProvider } = UI;
      const columns = [{ id: 'todo', title: 'To do' }, { id: 'doing', title: 'In progress', limit: 2 }, { id: 'review', title: 'In review' }, { id: 'done', title: 'Done' }];
      const cards0 = [
        { id: 'c1', columnId: 'todo', title: 'Typed dates in DatePicker', labels: [{ label: 'forms' }], assignee: { name: 'Ada Lovelace' } },
        { id: 'c2', columnId: 'todo', title: 'Billing page', description: 'Plan, usage, invoices', labels: [{ label: 'blocks', tone: 'default' }] },
        { id: 'c3', columnId: 'todo', title: 'Spanish dictionary' },
        { id: 'c4', columnId: 'doing', title: 'Kanban block', labels: [{ label: 'a11y', tone: 'warning' }], assignee: { name: 'Grace Hopper' } },
        { id: 'c5', columnId: 'doing', title: 'Server-driven DataTable', assignee: { name: 'Matthieu C.' } },
        { id: 'c6', columnId: 'review', title: 'Notifications menu', labels: [{ label: 'blocks', tone: 'default' }] },
        { id: 'c7', columnId: 'done', title: 'Starter demo on Pages', labels: [{ label: 'shipped', tone: 'success' }] }];
      function Demo() { const [cards, setCards] = React.useState(cards0); return h(KanbanBoard, { columns, cards, onCardsChange: setCards }); }
      ReactDOM.createRoot(document.getElementById('root')).render(h(TooltipProvider, null, h(Demo)));
    }
    render();
  </script>
