<!DOCTYPE html>
<html lang="en">
<head>

<style>

  #root{padding:24px 28px}

<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.RadarChart || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { RadarChart } = UI;
      const data = [['Coding', 92, 78], ['Reasoning', 88, 72], ['Writing', 90, 81], ['Tool use', 94, 83], ['Speed', 64, 95], ['Cost', 55, 88]].map(([metric, sonnet, haiku]) => ({ metric, sonnet, haiku }));
      ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { maxWidth: 520 } }, h(RadarChart, { data, angleKey: 'metric', max: 100, height: 320, series: [{ key: 'sonnet', label: 'Claude Sonnet' }, { key: 'haiku', label: 'Claude Haiku' }], 'aria-label': 'Two models on six evals' })));
    }
    render();
  </script>
</body>
</html>
