<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.JsonInput || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { JsonInput } = UI;
      function Demo() {
        const [v, setV] = React.useState('{\n  "event": "invoice.paid",\n  "retries": 3\n}');
        return h('div', { style: { maxWidth: 420 } }, h(JsonInput, { 'aria-label': 'Payload', value: v, onValueChange: setV, rows: 6 }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
