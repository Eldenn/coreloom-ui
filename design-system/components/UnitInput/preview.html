<!-- @dsCard group="Forms" height=120 subtitle="Number + unit select · conversion" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.UnitInput || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { UnitInput } = UI;
      function Demo() {
        const [v, setV] = React.useState({ value: 16, unit: 'px' });
        return h(UnitInput, { 'aria-label': 'Size', value: v, onValueChange: setV, units: [{ value: 'px' }, { value: 'rem' }], convert: (n, f, t) => f === 'px' && t === 'rem' ? n / 16 : f === 'rem' && t === 'px' ? n * 16 : n });
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
