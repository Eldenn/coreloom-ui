<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.TransferList || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { TransferList } = UI;
      function Demo() {
        const [v, setV] = React.useState(['name', 'email']);
        return h(TransferList, { 'aria-label': 'Columns', value: v, onValueChange: setV, options: ['name', 'email', 'role', 'team', 'created', 'last-seen'].map((c) => ({ value: c, label: c[0].toUpperCase() + c.slice(1).replace('-', ' ') })) });
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
