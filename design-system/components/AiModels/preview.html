<!-- @dsCard group="AI" height=620 subtitle="ModelPicker · ModelList · ContextMeter (ring, bar) · breakdown" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-muted);margin:0 0 10px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.ModelPicker || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;

      const models = [
        { id: 'claude-sonnet', name: 'Claude Sonnet', provider: 'Anthropic', description: 'Balanced: strong at code and agents.', contextWindow: 200000, pricing: { input: 3, output: 15 }, capabilities: ['vision', 'tools', 'reasoning'] },
        { id: 'claude-haiku', name: 'Claude Haiku', provider: 'Anthropic', description: 'Quick answers at a low price.', contextWindow: 200000, pricing: { input: 1, output: 5 }, capabilities: ['vision', 'tools', 'fast'] },
        { id: 'gpt-mini', name: 'GPT mini', provider: 'OpenAI', description: 'Small and cheap, for classification.', contextWindow: 128000, pricing: { input: 0.15, output: 0.6 }, capabilities: ['tools', 'fast'] },
        { id: 'mistral-large', name: 'Mistral Large', provider: 'Mistral', description: 'Hosted in Europe.', contextWindow: 128000, pricing: { input: 2, output: 6 }, capabilities: ['tools'] },
      ];
      const usage = { inputTokens: 80412, inputTokenDetails: { cacheReadTokens: 61200 }, outputTokens: 4180, outputTokenDetails: { reasoningTokens: 2350 }, totalTokens: 84592 };
      function App() {
        const [model, setModel] = React.useState('claude-sonnet');
        const current = models.find((m) => m.id === model);
        return h('div', { className: 'grid gap-6', style: { gridTemplateColumns: '1fr 1fr' } },
          h('div', { className: 'flex flex-col gap-3' },
            h('p', { className: 'cap' }, 'ModelPicker · ContextMeter'),
            h('div', { className: 'flex items-center gap-2 rounded-lg border border-border bg-inset px-2 py-1.5' },
              h(UI.ModelPicker, { models, value: model, onValueChange: setModel }),
              h(UI.ContextMeter, { used: usage, model: current }),
              h(UI.ContextMeter, { used: 186000, model: current, variant: 'bar' })),
            h('p', { className: 'cap', style: { marginTop: 12 } }, 'ContextBreakdown'),
            h('div', { className: 'rounded-lg border border-border bg-card p-4' }, h(UI.ContextBreakdown, { used: usage, model: current }))),
          h('div', null, h('p', { className: 'cap' }, 'ModelList'),
            h('div', { className: 'rounded-lg border border-border bg-card' }, h(UI.ModelList, { models, value: model, onValueChange: setModel }))));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(UI.TooltipProvider, null, h(App)));
    }
    render();
  </script>
</body>
</html>
