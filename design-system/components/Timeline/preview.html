<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Timeline || !UI.TimelineItem || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Timeline, TimelineItem } = UI;
      function Demo() {
        const item = (tone, title, time, description) => h(TimelineItem, { tone, title, time, description });
        return h('div', { style: { maxWidth: 420 } }, h(Timeline, { 'aria-label': 'Order tracking' },
          item('success', 'Order placed', 'Oct 10, 09:12'),
          item('success', 'Paid', 'Oct 10, 09:13'),
          item('primary', 'Shipped', 'Oct 12, 16:40', 'Parcel 6A1 204 889.'),
          item('neutral', 'Delivered', null, 'Expected Oct 15.')));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
