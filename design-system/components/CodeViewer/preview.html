<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.CodeViewer || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { CodeViewer } = UI;
      function Demo() {
        const code = "export function useDebounced(value, delay = 300) {\n  const [debounced, set] = React.useState(value)\n  React.useEffect(() => {\n    const id = setTimeout(() => set(value), delay)\n    return () => clearTimeout(id)\n  }, [value, delay])\n  return debounced\n}";
        return h('div', { style: { maxWidth: 560 } }, h(CodeViewer, { code, title: 'use-debounced.js', highlight: '3-6' }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
