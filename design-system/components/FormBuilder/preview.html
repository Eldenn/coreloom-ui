<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.FormBuilder || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const spec = {
        version: 1,
        title: 'Request a demo',
        sections: [{ id: 'main', columns: 2, fields: [
          { name: 'name', type: 'text', label: 'Full name', required: true },
          { name: 'email', type: 'email', label: 'Work email', required: true },
          { name: 'kind', type: 'radio', label: 'Who is it for?', defaultValue: 'company', options: [{ value: 'me', label: 'Just me' }, { value: 'company', label: 'A company' }] },
          { name: 'company', type: 'text', label: 'Company', visibleWhen: { field: 'kind', op: 'equals', value: 'company' } },
        ] }],
      };
      ReactDOM.createRoot(document.getElementById('root')).render(h(UI.FormBuilder, { defaultValue: spec }));
    }
    render();
  </script>
</body>
</html>
