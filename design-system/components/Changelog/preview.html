<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 32px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Changelog || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Changelog } = UI;
      const d = (m, day) => new Date(2026, m - 1, day);
      const entries = [
        { id: 'v240', date: d(10, 13), version: '2.4.0', title: 'Voice agents and a shop', summary: 'Talk to your agents with push-to-talk, and sell a few products.', changes: [
          { kind: 'new', text: 'Voice agent block: push-to-talk, states and a live transcript.' },
          { kind: 'new', text: 'Shop block: product page, cart and order summary.' },
          { kind: 'fixed', text: 'The cookie banner returns focus where it was.' }] },
        { id: 'v231', date: d(10, 2), version: '2.3.1', title: 'Fixes for the Gantt chart', changes: [
          { kind: 'fixed', text: 'Dragging across a daylight-saving change no longer shifts a bar.' },
          { kind: 'security', text: 'Links in model output are checked against the allowed protocols.' }] }];
      function Demo() { return h('div', { style: { maxWidth: 960, margin: '0 auto' } }, h(Changelog, { entries, title: 'Changelog', description: 'New components, improvements and fixes.', feedUrl: '#' })); }
      ReactDOM.createRoot(document.getElementById('root')).render(h(UI.TooltipProvider, null, h(Demo)));
    }
    render();
  </script>
</body>
</html>
