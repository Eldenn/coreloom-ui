<!-- @dsCard group="Feedback" height=170 subtitle="Saved · saving · unsaved · couldn't save + Retry" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.SaveStatus || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { SaveStatus } = UI;
      function Demo() {
        const savedAt = new Date(Date.now() - 2 * 60000);
        return h('div', { style: { display: 'grid', gap: 10 } },
          h(SaveStatus, { state: 'saved', savedAt }),
          h(SaveStatus, { state: 'saving' }),
          h(SaveStatus, { state: 'unsaved' }),
          h(SaveStatus, { state: 'error', onRetry: () => {} }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
