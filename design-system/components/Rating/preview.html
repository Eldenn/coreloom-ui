<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Rating || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Rating } = UI;
      function Demo() {
        const [s, setS] = React.useState(4);
        return h('div', { className: 'flex flex-col gap-3' }, h(Rating, { 'aria-label': 'Your rating', value: s, onValueChange: setS, size: 'lg' }), h(Rating, { readOnly: true, value: 4.5, size: 'sm' }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
