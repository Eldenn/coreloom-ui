<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.JsonViewer || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { JsonViewer } = UI;
      function Demo() {
        const value = { id: 'evt_01J9', type: 'invoice.paid', livemode: false, data: { amount: 4900, currency: 'eur', customer: { id: 'cus_204', name: 'Atelier Martin' }, lines: [{ quantity: 5 }, { quantity: 1 }], discount: null } };
        return h('div', { style: { maxWidth: 480 } }, h(JsonViewer, { value, rootLabel: 'webhook.json', defaultExpandDepth: 2 }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
