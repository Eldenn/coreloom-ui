<!DOCTYPE html>

<body>

      const h = React.createElement;
      ReactDOM.createRoot(document.getElementById('root')).render(h(UI.DiagramEditor, { defaultValue: "classDiagram\n  class Order {\n    <<entity>>\n    +String id\n    +total() Money\n  }\n  class LineItem {\n    +int quantity\n  }\n  class Payment {\n    <<abstract>>\n    +capture()* bool\n  }\n  Customer \"1\" --> \"*\" Order : places\n  Order *-- LineItem\n  Order o-- Payment\n  Payment <|-- CardPayment\n  Payment <|-- BankTransfer", height: '520px' }));
    }
    render();
  </script>
</body>
