<!-- @dsCard group="Motion" height=230 subtitle="Status button · drawn icons · lists · sliding tabs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.StatusButton || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { StatusButton, DrawIcon, Tabs, TabsList, TabsTrigger, TabsIndicator } = UI;
      function Demo() {
        const [status, setStatus] = React.useState('idle');
        const save = () => { setStatus('loading'); setTimeout(() => { setStatus('success'); setTimeout(() => setStatus('idle'), 1500); }, 900); };
        return h('div', { style: { display: 'grid', gap: 18 } },
          h('div', { style: { display: 'flex', gap: 12, alignItems: 'center' } },
            h(StatusButton, { status, onClick: save, loadingLabel: 'Saving…', successLabel: 'Saved' }, 'Save changes'),
            h(DrawIcon, { icon: 'circle-check', className: 'size-7 text-success' })),
          h(Tabs, { defaultValue: 'a' },
            h(TabsList, null,
              h(TabsTrigger, { value: 'a' }, 'Overview'),
              h(TabsTrigger, { value: 'b' }, 'Deployments'),
              h(TabsTrigger, { value: 'c' }, 'Settings'),
              h(TabsIndicator))));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
