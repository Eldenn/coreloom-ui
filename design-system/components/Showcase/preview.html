<!-- @dsCard group="Blocks" width=1280 height=1500 subtitle="showcase block · hero with image · practitioner cards · contact + opening hours · quote · multi-column footer" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
</style>
</head>
<body data-surface="bone" class="bg-background">
  <div id="root"></div>
  <script>
    const svg = (body, w, h) => 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' + body + '</svg>');
    const room = svg('<rect width="800" height="600" fill="#d9d2c5"/><rect x="470" y="70" width="250" height="300" rx="6" fill="#eef3f6" stroke="#b9b0a2" stroke-width="10"/><rect y="440" width="800" height="160" fill="#b8ad9b"/><rect x="120" y="360" width="380" height="40" rx="14" fill="#4f6b7d"/>', 800, 600);
    const portrait = (bg, skin, hair, top) => svg('<rect width="400" height="500" fill="' + bg + '"/><path d="M60 500c10-110 70-160 140-160s130 50 140 160z" fill="' + top + '"/><ellipse cx="200" cy="215" rx="78" ry="92" fill="' + skin + '"/><path d="M118 210c-6-80 40-122 86-122 50 0 88 40 80 122-14-40-40-64-82-66-42 2-70 26-84 66z" fill="' + hair + '"/>', 400, 500);
    const map = svg('<rect width="800" height="600" fill="#e7e3da"/><path d="M0 180H800M0 420H800M220 0V600M560 0V600" stroke="#fdfbf7" stroke-width="34"/><path d="M400 250c-34 0-60 26-60 58 0 44 60 102 60 102s60-58 60-102c0-32-26-58-60-58z" fill="#4f6b7d"/>', 800, 600);
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.PractitionerCard || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const I = UI.icons;
      const { SiteHeader, SiteFooter, Hero, PractitionerGrid, PractitionerCard, Quote, ContactSection, ContactDetails, OpeningHours, Button, TooltipProvider } = UI;
      const brand = h('a', { href: '#', className: 'font-display text-[19px] font-semibold tracking-[-0.02em] text-foreground' }, 'Atelier ', h('span', { className: 'text-primary-text' }, 'Ostéo'));
      const range = (a, b) => ({ open: a, close: b });
      const day = [range('09:00', '12:30'), range('14:00', '19:00')];
      const people = [
        ['Claire Morel', 'Osteopath D.O.', portrait('#c9d4dc', '#e8c4a8', '#5a3b2a', '#4f6b7d'), ['Infants', 'Pregnancy']],
        ['Karim Benali', 'Osteopath D.O. — sports', portrait('#d8cfc1', '#b98a68', '#1f1a17', '#2e3d47'), ['Sports', 'Joints']],
        ['Inès Garnier', 'Osteopath D.O.', portrait('#cfd8cf', '#f0d0b8', '#a8743f', '#6b5b4b'), ['Seniors', 'Headaches']],
      ];
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(TooltipProvider, null,
          h(SiteHeader, { brand, links: [{ label: 'The practice', href: '#' }, { label: 'Team', href: '#' }, { label: 'Contact', href: '#' }], actions: h(Button, { size: 'sm' }, 'Book a visit') }),
          h(Hero, { layout: 'split', eyebrow: 'Osteopathy · Lyon 6e', title: 'Move freely,', highlight: 'at every age.',
            description: 'Three osteopaths for babies, athletes and everyone in between. Appointments within the week.',
            media: h('img', { src: room, alt: 'The treatment room' }),
            actions: h(React.Fragment, null, h(Button, { size: 'lg' }, 'Book a visit', h(I.arrowRight)), h(Button, { size: 'lg', variant: 'secondary' }, '04 78 00 00 00')) }),
          h('div', { 'data-theme': 'dark', 'data-surface': 'mineral', className: 'bg-background' },
            h(PractitionerGrid, { eyebrow: 'The team', title: 'Three osteopaths, one practice' },
              people.map(([name, role, photo, specialties]) => h(PractitionerCard, { key: name, headingLevel: 3, name, profession: role, specialties, photo: h('img', { src: photo, alt: '' }),
                actions: h(Button, { size: 'sm', variant: 'secondary' }, 'Book with ' + name.split(' ')[0]) })))),
          h('section', { className: 'px-5 py-16' }, h(Quote, { variant: 'large', align: 'center', author: 'Sophie L.', byline: 'Patient since 2021' }, 'Calm, precise, and always on time.')),
          h(ContactSection, { eyebrow: 'Contact', title: 'Come and see us', className: 'border-t border-border-subtle', map: h('img', { src: map, alt: 'Map of the practice' }) },
            h(ContactDetails, { address: '24 rue Vendôme, 69006 Lyon', directionsHref: 'https://www.openstreetmap.org/', phone: '04 78 00 00 00', email: 'contact@atelier-osteo.example' }),
            h(OpeningHours, { now: new Date(2026, 9, 14, 10, 30), hours: { monday: day, tuesday: day, wednesday: [range('09:00', '12:30')], thursday: day, friday: day, saturday: [range('09:00', '13:00')] } })),
          h(SiteFooter, { brand: h(React.Fragment, null, brand, h('p', { className: 'm-0' }, 'Osteopathy in Lyon 6e since 2014.')),
            columns: [{ title: 'The practice', links: [{ label: 'Our approach', href: '#' }, { label: 'The team', href: '#' }] }, { title: 'Care', links: [{ label: 'Infants', href: '#' }, { label: 'Sports', href: '#' }] }, { title: 'Visit us', content: '24 rue Vendôme, 69006 Lyon' }],
            note: '© 2026 Atelier Ostéo', links: [{ label: 'Legal notice', href: '#' }, { label: 'Privacy', href: '#' }] })));
    }
    render();
  </script>
</body>
</html>
