<!-- @dsCard group="Data display" height=150 subtitle="Locale numbers · currency · bytes · count-up" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.FormatNumber || !UI.AnimatedNumber || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { FormatNumber, AnimatedNumber } = UI;
      function Demo() {
        const row = (k, v) => h('div', { style: { display: 'flex', justifyContent: 'space-between', gap: 24 } }, h('span', { style: { color: 'var(--fg-muted)' } }, k), v);
        return h('div', { style: { display: 'grid', gap: 6, maxWidth: 300, fontSize: 14 } },
          row('currency', h(FormatNumber, { value: 1290.5, format: 'currency', currency: 'EUR' })),
          row('percent', h(FormatNumber, { value: 0.042, format: 'percent', signDisplay: 'exceptZero' })),
          row('compact', h(FormatNumber, { value: 1284000, format: 'compact' })),
          row('bytes', h(FormatNumber, { value: 3480000000, format: 'bytes' })),
          row('animated', h(AnimatedNumber, { value: 48210 })));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
