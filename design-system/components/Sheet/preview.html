<!-- @dsCard group="Overlays" height=420 subtitle="Right edge · header · fields · footer actions" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);padding:0;font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Sheet || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Sheet, SheetTrigger, SheetContent, SheetHeader, SheetTitle, SheetDescription, SheetFooter, SheetClose, Button, Field, FieldLabel, FieldDescription, Input, Switch, Label, Icon } = UI;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(Sheet, { defaultOpen: true },
          h(SheetTrigger, { asChild: true }, h(Button, { variant: 'secondary' }, h(Icon, { name: 'sliders' }), 'Project settings')),
          h(SheetContent, null,
            h(SheetHeader, null,
              h(SheetTitle, null, 'Project settings'),
              h(SheetDescription, null, 'Changes apply to every environment of coreloom-app.')),
            h('div', { style: { display: 'flex', flexDirection: 'column', gap: 20, padding: '0 22px' } },
              h(Field, null, h(FieldLabel, { htmlFor: 'n' }, 'Project name'), h(Input, { id: 'n', defaultValue: 'coreloom-app' }), h(FieldDescription, null, 'Lowercase, hyphen-separated.')),
              h('div', { style: { display: 'flex', gap: 11, alignItems: 'center' } }, h(Switch, { id: 'ad', defaultChecked: true }), h(Label, { htmlFor: 'ad', style: { fontSize: 14, fontWeight: 400 } }, 'Auto-deploy main'))),
            h(SheetFooter, null,
              h(SheetClose, { asChild: true }, h(Button, { variant: 'ghost' }, 'Cancel')),
              h(SheetClose, { asChild: true }, h(Button, null, 'Save changes'))),
          ))
      );
    }
    render();
  </script>
</body>
</html>
