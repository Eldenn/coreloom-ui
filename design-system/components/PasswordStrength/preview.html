<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.PasswordStrength || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { PasswordStrength } = UI;
      function Demo() {
        const [p, setP] = React.useState('Sunflower7');
        return h('div', { className: 'flex flex-col gap-2' }, h('input', { 'aria-label': 'Password', value: p, onChange: (e) => setP(e.target.value), className: 'h-9 rounded-md border border-input bg-inset px-2.5 text-[14px]' }), h(PasswordStrength, { password: p }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
