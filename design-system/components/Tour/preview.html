<!-- @dsCard group="Overlays" height=120 subtitle="Spotlight · steps · back / next / skip" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Tour || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Tour } = UI;
      function Demo() {
        const [open, setOpen] = React.useState(false);
        return h('div', null,
          h('button', { id: 'tour-card-start', onClick: () => setOpen(true), style: { font: 'inherit', padding: '6px 12px' } }, 'Start the tour'),
          h(Tour, { open, onOpenChange: setOpen, steps: [
            { target: '#tour-card-start', title: 'This button', content: 'Starts the tour again.' },
            { title: 'That’s it', content: 'Tours point at the parts of a screen, one idea per step.' }] }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
