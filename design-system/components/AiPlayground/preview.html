<!-- @dsCard group="AI" height=860 subtitle="Playground · two models side by side · Run all streams" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-muted);margin:0 0 10px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Playground || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;

      const models = [{ id: 'claude-sonnet', name: 'Claude Sonnet', provider: 'Anthropic' }, { id: 'claude-haiku', name: 'Claude Haiku', provider: 'Anthropic' }, { id: 'gpt-mini', name: 'GPT mini', provider: 'OpenAI' }];
      const out = { a: 'Your build failed on a **type error**: `Workspace.slug` was renamed to `handle`. Update `settings.tsx` and push again.', b: 'The deployment failed during type checking because `slug` no longer exists on `Workspace`; it is now `handle`. Rename it in `src/routes/settings.tsx`, run `pnpm typecheck`, then redeploy.' };
      function App() {
        const [results, setResults] = React.useState({ a: { status: 'done', text: out.a, latencyMs: 1240, tokens: 412, cost: 0.0021 }, b: { status: 'done', text: out.b, latencyMs: 3180, tokens: 655, cost: 0.0089 } });
        return h(UI.Playground, { models, defaultSystem: 'You explain failed deployments to developers in two sentences.', defaultPrompt: 'Why did deployment dpl_8f2k fail?',
          defaultVariants: [{ id: 'a', model: 'claude-haiku', temperature: 0.2 }, { id: 'b', model: 'claude-sonnet', temperature: 0.7 }], results,
          onRun: ({ variants }) => variants.forEach((v) => { const full = out[v.id] || out.a; let i = 0; const t = setInterval(() => { i += 4; const done = i >= full.length; setResults((r) => ({ ...r, [v.id]: done ? { status: 'done', text: full, latencyMs: 900 + full.length * 9, tokens: full.length * 2, cost: 0.003 } : { status: 'running', text: full.slice(0, i) } })); if (done) clearInterval(t); }, 25); }) });
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(App));
    }
    render();
  </script>
</body>
</html>
