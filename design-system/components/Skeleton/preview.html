<!-- @dsCard group="Data display" height=150 subtitle="Card and list placeholders" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);padding:0;font-family:var(--font-sans);}
  #root{padding:24px 28px}
  .card{display:flex;gap:14px;align-items:center;max-width:420px;padding:18px 20px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface-2)}
  .lines{display:flex;flex-direction:column;gap:8px;flex:1}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Skeleton || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Skeleton } = UI;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h('div', { className: 'card' },
          h(Skeleton, { className: 'size-[34px] rounded-[9px]' }),
          h('div', { className: 'lines' }, h(Skeleton, { className: 'h-4 w-2/5' }), h(Skeleton, { className: 'h-3 w-4/5' }), h(Skeleton, { className: 'h-3 w-3/5' })))
      );
    }
    render();
  </script>
</body>
</html>
