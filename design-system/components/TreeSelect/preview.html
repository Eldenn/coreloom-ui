<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.TreeSelect || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { TreeSelect } = UI;
      function Demo() {
        const [v, setV] = React.useState('frontend');
        return h('div', { style: { maxWidth: 320 } }, h(TreeSelect, { 'aria-label': 'Team', value: v, onValueChange: setV, nodes: [{ value: 'eng', label: 'Engineering', children: [{ value: 'frontend', label: 'Frontend' }, { value: 'backend', label: 'Backend' }] }, { value: 'design', label: 'Design' }] }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
