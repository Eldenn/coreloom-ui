          h(Gauge, { value: 86, unit: '%', warning: 80, critical: 95, label: 'Seats used' }),
          h(Gauge, { value: 97, unit: '%', warning: 80, critical: 95, label: 'API quota' }),
          h(Gauge, { value: 99.32, min: 95, max: 100, unit: '%', warning: 99.5, critical: 99, higherIsBetter: true, label: 'Uptime', formatValue: (v) => v.toFixed(2) })));
