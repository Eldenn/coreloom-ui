<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 32px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.TwoFactorSettings || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;

      const { TwoFactorSettings, ActiveSessions, TooltipProvider } = UI;
      const at = (d, hh) => new Date(2026, 9, d, hh);
      function Demo() {
        const [enabled, setEnabled] = React.useState(false);
        const [sessions, setSessions] = React.useState([
          { id: 's1', name: 'Chrome on macOS', device: 'laptop', location: 'Paris, France', ip: '92.184.10.7', lastActiveAt: at(14, 10), current: true },
          { id: 's2', name: 'Safari on iPhone', device: 'phone', location: 'Paris, France', lastActiveAt: at(14, 8) },
          { id: 's3', name: 'Firefox on Windows', device: 'desktop', location: 'Lyon, France', lastActiveAt: at(2, 17) }]);
        return h('div', { style: { maxWidth: 720, margin: '0 auto', display: 'flex', flexDirection: 'column', gap: 24 } },
          h(TwoFactorSettings, { enabled, recoveryCodesLeft: 10, enabledAt: at(14, 10),
            onSetupStart: () => ({ secret: 'JBSWY3DPEHPK3PXP' }),
            onSetupVerify: () => { setEnabled(true); return { recoveryCodes: ['7KQ2-M4XD', 'P9VA-3HTN', 'C6WE-8ZRJ', 'L2YF-5BQS'] }; },
            onDisable: () => setEnabled(false) }),
          h(ActiveSessions, { sessions, onRevoke: (id) => setSessions((l) => l.filter((s) => s.id !== id)), onRevokeOthers: () => setSessions((l) => l.filter((s) => s.current)) }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(TooltipProvider, null, h(Demo)));
    }
    render();
  </script>
</body>
</html>
