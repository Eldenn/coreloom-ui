<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.LogViewer || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const start = Date.parse('2026-10-14T08:00:00Z');
      const entries = Array.from({ length: 120 }, (_, i) => {
        const time = new Date(start + i * 1537);
        if (i % 29 === 28) return { id: i, time, level: 'error', source: 'api', message: 'POST /api/export 500: timeout waiting for the export worker' };
        if (i % 13 === 12) return { id: i, time, level: 'warn', source: 'db', message: 'slow query: SELECT * FROM events (' + (900 + i) + ' ms)' };
        return { id: i, time, level: 'info', source: 'api', message: 'GET /api/projects 200 ' + (2 + (i % 9)) + 'ms' };
      });
      ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { maxWidth: 760 } }, h(UI.LogViewer, { entries, height: 260, timeZone: 'UTC' })));
    }
    render();
  </script>
</body>
</html>
