<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.EditableText || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { EditableText } = UI;
      function Demo() {
        return h('div', { className: 'font-display text-[22px] font-semibold' }, h(EditableText, { label: 'project name', defaultValue: 'Acme launch' }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
