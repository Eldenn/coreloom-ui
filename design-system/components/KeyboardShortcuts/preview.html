<!-- @dsCard group="Actions" height=130 subtitle="useHotkeys · Hotkey · shortcuts dialog" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.useHotkeys || !UI.Hotkey || !UI.ShortcutsDialog || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { useHotkeys, Hotkey, ShortcutsDialog } = UI;
      function Demo() {
        const [open, setOpen] = React.useState(false);
        const [last, setLast] = React.useState('—');
        useHotkeys('shift+?', () => setOpen(true));
        useHotkeys(['mod+k', 'g i'], (e, combo) => setLast(combo));
        return h('div', { style: { display: 'grid', gap: 10, fontSize: 14 } },
          h('div', { style: { display: 'flex', gap: 16 } }, h(Hotkey, { keys: 'mod+k' }), h(Hotkey, { keys: 'g i' }), h(Hotkey, { keys: 'shift+?' })),
          h('span', null, 'Last: ', last),
          h(ShortcutsDialog, { open, onOpenChange: setOpen, groups: [{ title: 'General', shortcuts: [{ keys: 'mod+k', description: 'Command palette' }, { keys: 'g i', description: 'Go to the inbox' }] }] }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
