<!-- @dsCard group="AI" height=140 subtitle="AgentAvatar · face or dots: idle, thinking, speaking, done, error, offline" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.AgentAvatar || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { AgentAvatar } = UI;
      const states = ['idle', 'thinking', 'speaking', 'done', 'error', 'offline'];
      function Row(variant) {
        return h('div', { style: { display: 'flex', gap: 16 } },
          states.map((s) => h(AgentAvatar, { key: s, name: 'Researcher', seed: 'researcher', variant, state: s, size: 'lg' })));
      }
      function Demo() {
        return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } }, Row('face'), Row('dots'));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
