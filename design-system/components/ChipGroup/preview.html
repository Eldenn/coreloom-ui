<!-- @dsCard group="Forms" height=120 subtitle="Multiple · single · counts" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.ChipGroup || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { ChipGroup } = UI;
      function Demo() {
        const [v, setV] = React.useState(['open', 'mine']);
        return h(ChipGroup, { 'aria-label': 'Filters', value: v, onValueChange: setV, options: [{ value: 'open', label: 'Open', count: 12 }, { value: 'mine', label: 'Mine', count: 4 }, { value: 'week', label: 'This week' }, { value: 'urgent', label: 'Urgent' }] });
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
