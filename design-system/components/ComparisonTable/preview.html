        { id: 'b', name: 'Basics', features: [

          { id: 's', name: 'Storage', description: 'Files and exports', values: { free: '1 GB', team: '100 GB', ent: '1 TB' } },
          { id: 't', name: 'Dark and light themes', values: { free: true, team: true, ent: true } }] },
        { id: 'sec', name: 'Security', features: [
          { id: 'r', name: 'Custom roles', values: { free: false, team: 'partial', ent: true } },

          { id: 'a', name: 'Audit log', values: { free: false, team: true, ent: true } }] }];
      function Demo() { return h('div', { style: { maxWidth: 960, margin: '0 auto' } }, h(ComparisonTable, { plans, groups, onSelect: () => {} })); }
