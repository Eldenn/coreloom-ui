<!-- @dsCard group="Data display" height=180 subtitle="Determinate · labelled" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);padding:0;font-family:var(--font-sans);}
  #root{padding:24px 28px}
  .stack{display:flex;flex-direction:column;gap:18px;max-width:460px}
  .head{display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:var(--fg-2);margin-bottom:9px}
  .v{font-family:var(--font-mono);font-size:12px;color:var(--fg-1)}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Progress || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Progress } = UI;
      const P = (label, v) => h('div', null, h('div', { className: 'head' }, h('span', null, label), h('span', { className: 'v' }, v + '%')), h(Progress, { value: v, 'aria-label': label }));
      ReactDOM.createRoot(document.getElementById('root')).render(
        h('div', { className: 'stack' }, P('Uploading build artifacts', 64), P('Type-checking packages', 100), P('Publishing to the registry', 12))
      );
    }
    render();
  </script>
</body>
</html>
