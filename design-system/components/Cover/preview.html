<!-- @dsCard height=288 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);width:960px;height:288px;position:relative;overflow:hidden;}
  svg{position:absolute;top:0;left:0;display:block;}
  .steel{fill:var(--cl-steel);}
  .tint{fill:var(--cyan-200);}
  .cyan{fill:var(--cl-cyan);}
  .teal{fill:var(--cl-teal);}
  .cut{fill:var(--bg-1);}
  .r{rx:var(--radius-lg);ry:var(--radius-lg);}
  .text{position:absolute;left:48px;bottom:40px;}
  .name{margin:0;font-family:var(--font-display);font-weight:700;font-size:56px;line-height:.95;
        letter-spacing:var(--ls-tighter);color:var(--fg-1);white-space:nowrap;}
  .tag{margin:12px 0 0;font-family:var(--font-sans);font-size:14px;line-height:1.45;color:var(--fg-muted);}
</style>
</head>
<body>
  <svg width="960" height="112" viewBox="0 0 960 112" aria-hidden="true">
    <!--
      blocks: cl-cyan 384×132 (space-24×4, the identity hue, largest), cl-teal 176×100, cl-steel 192×84, cyan-200 64×116 — corners radius-lg, tops bleed off the edge.
      arrangement: top-band skeleton (the name is too wide for its zone at 64px) — a strip of unequal bands, space-4 gaps, left inset space-12.
      pattern: dot grid at one spacing step (space-6 pitch), cut out of the cyan block in bg-1 — the brand is precise and technical on a 4px base grid and asks for "abstract lattice/grid motifs".
      scales: space-4 gap, space-6 pitch, space-12 inset, dot radius radius-xs, block corners radius-lg.
    -->
    <rect class="steel r" x="48" y="-20" width="192" height="84"/>
    <rect class="tint r" x="256" y="-20" width="64" height="116"/>
    <rect class="cyan r" x="336" y="-20" width="384" height="132"/>
    <rect class="teal r" x="736" y="-20" width="176" height="100"/>
    <g class="cut">
      <circle cx="360" cy="36" r="4"/><circle cx="384" cy="36" r="4"/><circle cx="408" cy="36" r="4"/><circle cx="432" cy="36" r="4"/><circle cx="456" cy="36" r="4"/><circle cx="480" cy="36" r="4"/><circle cx="504" cy="36" r="4"/><circle cx="528" cy="36" r="4"/><circle cx="552" cy="36" r="4"/><circle cx="576" cy="36" r="4"/><circle cx="600" cy="36" r="4"/><circle cx="624" cy="36" r="4"/><circle cx="648" cy="36" r="4"/><circle cx="672" cy="36" r="4"/><circle cx="696" cy="36" r="4"/>
      <circle cx="360" cy="60" r="4"/><circle cx="384" cy="60" r="4"/><circle cx="408" cy="60" r="4"/><circle cx="432" cy="60" r="4"/><circle cx="456" cy="60" r="4"/><circle cx="480" cy="60" r="4"/><circle cx="504" cy="60" r="4"/><circle cx="528" cy="60" r="4"/><circle cx="552" cy="60" r="4"/><circle cx="576" cy="60" r="4"/><circle cx="600" cy="60" r="4"/><circle cx="624" cy="60" r="4"/><circle cx="648" cy="60" r="4"/><circle cx="672" cy="60" r="4"/><circle cx="696" cy="60" r="4"/>
      <circle cx="360" cy="84" r="4"/><circle cx="384" cy="84" r="4"/><circle cx="408" cy="84" r="4"/><circle cx="432" cy="84" r="4"/><circle cx="456" cy="84" r="4"/><circle cx="480" cy="84" r="4"/><circle cx="504" cy="84" r="4"/><circle cx="528" cy="84" r="4"/><circle cx="552" cy="84" r="4"/><circle cx="576" cy="84" r="4"/><circle cx="600" cy="84" r="4"/><circle cx="624" cy="84" r="4"/><circle cx="648" cy="84" r="4"/><circle cx="672" cy="84" r="4"/><circle cx="696" cy="84" r="4"/>
    </g>
  </svg>
  <div class="text">
    <h1 class="name">Coreloom UI Design System</h1>
    <p class="tag">Weave production UI from a core of accessible React primitives.</p>
  </div>
</body>
</html>
