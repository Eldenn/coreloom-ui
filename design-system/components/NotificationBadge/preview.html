<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.NotificationBadge || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { NotificationBadge } = UI;
      function Demo() {
        const box = { display: 'inline-flex', width: 32, height: 32, borderRadius: 8, background: 'var(--bg-3)' };
        return h('div', { style: { display: 'flex', gap: 28, alignItems: 'center', paddingTop: 8 } },
          h(NotificationBadge, { count: 3 }, h('span', { style: box })),
          h(NotificationBadge, { count: 128, tone: 'primary' }, h('span', { style: box })),
          h(NotificationBadge, { dot: true, pulse: true }, h('span', { style: box })),
          h(NotificationBadge, { dot: true, tone: 'success', placement: 'bottom-right', label: 'Online' }, h('span', { style: Object.assign({}, box, { borderRadius: 99 }) })));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
