<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.QuotaBar || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { QuotaBar } = UI;
      function Demo() {
        return h('div', { style: { maxWidth: 420 } }, h(QuotaBar, { label: 'Storage', max: 10e9, format: 'bytes', segments: [
          { label: 'Documents', value: 3.1e9 }, { label: 'Images', value: 2.4e9 }, { label: 'Videos', value: 1.2e9 }], description: 'Upgrade for 100 GB.' }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
