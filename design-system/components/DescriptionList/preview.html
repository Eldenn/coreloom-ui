<!DOCTYPE html>
<html lang="en">
<head>

<style>

  #root{padding:24px 28px}
</style>

<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.DescriptionList || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { DescriptionList } = UI;
      function Demo() {
        return h('div', { style: { maxWidth: 520 } }, h(DescriptionList, { layout: 'inline', items: [
          { term: 'Customer', value: 'Atelier Martin' },
          { term: 'Plan', value: 'Team', hint: 'Renews on Jan 12, 2027.' },
          { term: 'Workspace ID', value: 'ws_8f2kq91x', copy: 'ws_8f2kq91x' },
          { term: 'VAT number', value: '' }] }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
