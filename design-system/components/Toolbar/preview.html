<!-- @dsCard group="Actions" height=90 subtitle="Arrow keys · toggles · More menu" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Toolbar || !UI.ToolbarButton || !UI.ToolbarSeparator || !UI.ToolbarToggleGroup || !UI.ToolbarToggleItem || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Toolbar, ToolbarButton, ToolbarSeparator, ToolbarToggleGroup, ToolbarToggleItem } = UI;
      function Demo() {
        return h(Toolbar, { 'aria-label': 'Formatting', style: { width: 'fit-content' } },
          h(ToolbarToggleGroup, { type: 'multiple', 'aria-label': 'Style', defaultValue: ['bold'] },
            h(ToolbarToggleItem, { value: 'bold', 'aria-label': 'Bold' }, h('b', null, 'B')),
            h(ToolbarToggleItem, { value: 'italic', 'aria-label': 'Italic' }, h('i', null, 'I')),
            h(ToolbarToggleItem, { value: 'underline', 'aria-label': 'Underline' }, h('u', null, 'U'))),
          h(ToolbarSeparator),
          h(ToolbarButton, null, 'Link'),
          h(ToolbarButton, null, 'Comment'));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    }
    render();
  </script>
</body>
</html>
