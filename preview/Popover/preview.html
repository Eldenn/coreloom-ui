<!DOCTYPE html>
<html lang="en">
<head>

<style>
  html,body{margin:0}

  #root{padding:24px 28px}

<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Popover || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Popover, PopoverTrigger, PopoverContent, PopoverHeader, PopoverTitle, PopoverDescription, Button, Field, FieldLabel, Input, Icon } = UI;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(Popover, { defaultOpen: true },
          h(PopoverTrigger, { asChild: true }, h(Button, { variant: 'secondary' }, h(Icon, { name: 'palette' }), 'Radius')),
          h(PopoverContent, { align: 'start' },
            h('div', { style: { display: 'flex', flexDirection: 'column', gap: 14 } },
              h(PopoverHeader, null, h(PopoverTitle, null, 'Corner radius'), h(PopoverDescription, null, 'Applies to buttons, inputs and alerts.')),
              h(Field, null, h(FieldLabel, { htmlFor: 'r' }, 'radius-md'), h(Input, { id: 'r', defaultValue: '10px' })))))
      );
    }
    render();
  </script>
</body>
