<!-- @dsCard group="Blocks" width=1280 height=640 subtitle="pricing block · monthly / yearly · featured plan" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{max-width:1080px;margin:0 auto;padding:40px 32px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.PricingPlans || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const I = UI.icons;

      const { PricingPlans, TooltipProvider, Toaster, toast } = UI;
      const plans = [
        { id: 'hobby', name: 'Hobby', description: 'For side projects and trying things out.', monthly: 0, features: ['1 project', 'Preview deployments', 'Community support'], cta: 'Start for free' },
        { id: 'pro', name: 'Pro', description: 'For teams shipping to production.', monthly: 24, yearly: 19, features: ['Unlimited projects', 'Custom domains', 'Team roles and SSO', 'Email support'], cta: 'Start a 14-day trial', featured: true },
        { id: 'enterprise', name: 'Enterprise', description: 'Dedicated regions, SLAs and a security review.', monthly: null, features: ['Everything in Pro', '99.99% uptime SLA', 'Audit logs', 'A named contact'], cta: 'Contact sales' }];
      ReactDOM.createRoot(document.getElementById('root')).render(h(TooltipProvider, null,
        h('div', { className: 'flex flex-col items-center gap-3' },
          h('h2', { className: 'm-0 font-display text-[32px] font-semibold tracking-[-0.02em] text-foreground' }, 'Simple pricing'),
          h('p', { className: 'm-0 mb-4 text-[15px] text-muted-foreground' }, 'Start free, upgrade when you ship.'),
          h(PricingPlans, { plans, onSelect: (p, b) => toast(p.name + ' · ' + b) })), h(Toaster)));
    }
    render();
  </script>
</body>
</html>
