<!-- @dsCard group="Forms" height=120 subtitle="Single · range · disabled" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);padding:24px 28px;font-family:var(--font-sans);}
  #root{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
  .head{display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:var(--fg-2);margin-bottom:14px}
  .v{font-family:var(--font-mono);font-size:12px;color:var(--fg-1)}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Slider || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Slider } = UI;
      function S({ label, fmt, ...props }) {
        const [v, setV] = React.useState(props.defaultValue);
        return h('div', null, h('div', { className: 'head' }, h('span', null, label), h('span', { className: 'v' }, v.map(fmt).join(' – '))),
          h(Slider, { ...props, onValueChange: setV, 'aria-label': label }));
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(React.Fragment, null,
          h(S, { label: 'Border radius', defaultValue: [10], max: 28, fmt: x => x + 'px' }),
          h(S, { label: 'Price range', defaultValue: [20, 80], step: 5, fmt: x => '€' + x }),
          h(S, { label: 'Workers', defaultValue: [4], min: 1, max: 16, disabled: true, fmt: String }),
        )
      );
    }
    render();
  </script>
</body>
</html>
