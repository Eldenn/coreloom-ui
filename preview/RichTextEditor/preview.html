<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.RichTextEditor || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const I = UI.icons;

      const { RichTextEditor, Field, FieldLabel, FieldDescription, TooltipProvider } = UI;
      const sample = '<h2>Release notes</h2><p>This release adds <strong>typed dates</strong>, a <em>server-driven</em> table and a <a href="#">rich text editor</a>.</p><ul><li>Faster builds</li><li>Fewer surprises</li></ul><blockquote><p>Ship small, ship often.</p></blockquote>';
      ReactDOM.createRoot(document.getElementById('root')).render(h(TooltipProvider, null,
        h('div', { style: { maxWidth: 640 } }, h(Field, null,
          h(FieldLabel, { id: 'notes-label' }, 'Release notes'),
          h(RichTextEditor, { defaultValue: sample, 'aria-labelledby': 'notes-label', minHeight: 140 }),
          h(FieldDescription, null, 'Markdown shortcuts work: ## for a heading, - for a list.')))));
    }
    render();
  </script>
</body>
</html>
