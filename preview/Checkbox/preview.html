<!-- @dsCard group="Forms" height=200 subtitle="Checked · unchecked · indeterminate · invalid · disabled" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);padding:24px 28px;font-family:var(--font-sans);}
  #root{display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:11px;align-items:center;font-size:14px;color:var(--fg-2)}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Checkbox || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Checkbox, Label } = UI;
      const Row = (id, label, props) => h('div', { className: 'row' }, h(Checkbox, { id, ...props }), h(Label, { htmlFor: id, style: { fontSize: 14, fontWeight: 400 } }, label));
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(React.Fragment, null,
          Row('a', 'Tree-shake unused', { defaultChecked: true }),
          Row('b', 'Include sourcemaps', {}),
          Row('c', 'All packages', { checked: 'indeterminate' }),
          Row('d', 'I accept the license', { 'aria-invalid': true }),
          Row('e', 'Telemetry', { disabled: true }),
        )
      );
    }
    render();
  </script>
</body>
</html>
