<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);padding:24px 28px;font-family:var(--font-sans);}
  #root{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Badge || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Badge, BadgeDot } = UI;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(React.Fragment, null,
          h(Badge, { variant: 'default' }, h(BadgeDot), 'v2.4.0'),
          h(Badge, { variant: 'success' }, h(BadgeDot), 'Passing'),
          h(Badge, { variant: 'warning' }, h(BadgeDot), 'Beta'),
          h(Badge, { variant: 'destructive' }, h(BadgeDot), 'Deprecated'),
          h(Badge, null, 'stable'),
          h(Badge, { variant: 'outline' }, 'MIT'),
        )
      );
    }
    render();
  </script>
</body>
</html>
