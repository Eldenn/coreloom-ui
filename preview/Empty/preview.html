<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);}
  #root{padding:24px 28px}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    function render() {
      const UI = window.CoreloomUIDesignSystem_ff5f32;
      if (!UI || !UI.Empty || !window.ReactDOM) return setTimeout(render, 50);
      const h = React.createElement;
      const { Empty, EmptyHeader, EmptyMedia, EmptyTitle, EmptyDescription, EmptyContent, Button, Icon } = UI;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(Empty, { style: { border: '1px dashed var(--border)' } },
          h(EmptyHeader, null,
            h(EmptyMedia, { variant: 'icon' }, h(Icon, { name: 'folder' })),
            h(EmptyTitle, null, 'No projects yet'),
            h(EmptyDescription, null, 'Import a repository to deploy it. Every push to main ships to production.')),
          h(EmptyContent, null,
            h('div', { style: { display: 'flex', gap: 8 } },
              h(Button, null, h(Icon, { name: 'plus' }), 'New project'),
              h(Button, { variant: 'secondary' }, h(Icon, { name: 'bookOpen' }), 'Read the docs'))))
      );
    }
    render();
  </script>
</body>
</html>
