<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Coreloom starter</title>
    <script>
      // Applies the saved theme, accent and language before the first paint (no flash of the wrong theme).
      try {
        var t = localStorage.getItem('theme')
        if (
          t === 'light' ||
          (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        )
          document.documentElement.dataset.theme = 'light'
        var a = localStorage.getItem('accent')
        if (a) document.documentElement.dataset.accent = a
        var l = localStorage.getItem('locale')
        if (l) document.documentElement.lang = l
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
